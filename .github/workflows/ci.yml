name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Corpus in sync + tests + self-scan
        run: npm run check

      - name: Reference tar roundtrip
        shell: bash
        run: |
          set -e
          SANDBOX=$(mktemp -d)
          node bin/memex.js seed "$SANDBOX"
          cd "$SANDBOX"
          COPYFILE_DISABLE=1 tar cf out.tar --exclude out.tar .
          mkdir restored
          COPYFILE_DISABLE=1 tar xf out.tar -C restored
          node -e "
            const fs = require('fs');
            const before = fs.readdirSync('.').filter(n => n !== 'out.tar' && n !== 'restored');
            const after = fs.readdirSync('restored').filter(n => n !== 'out.tar');
            const afterSet = new Set(after);
            const missing = [];
            const normalized = [];
            for (const name of before) {
              if (afterSet.has(name)) continue;
              if (after.some(n => n.normalize('NFC') === name.normalize('NFC'))) { normalized.push(name); continue; }
              missing.push(name);
            }
            if (missing.length) { console.error('tar roundtrip FAILED — lost names:', missing); process.exit(1); }
            if (normalized.length) { console.error('tar roundtrip FAILED — normalized names:', normalized); process.exit(1); }
            console.log('tar roundtrip clean: ' + before.length + ' byte-exact');
          "
